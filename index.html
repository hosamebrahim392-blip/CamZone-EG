<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamZone-EG | مخطط وحاسبة الأنظمة الأمنية</title>
    <!-- استدعاء الخطوط والمكتبات الخارجية -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://cloudflare.com"></script>
    <!-- استدعاء مكتبة Supabase البرمجية للربط الآمن -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        /* ===== نظام الألوان والهوية البصرية التقنية (Tech Dark Theme) ===== */
        :root {
            --bg-primary: #1b1b1d;       /* الخلفية الأساسية الداكنة */
            --bg-secondary: #242526;     /* خلفية البطاقات والكتل */
            --neon-blue: #007fff;        /* أزرق نيون مضيء */
            --neon-orange: #ff7a1a;      /* برتقالي نيون مضيء */
            --text-title: #e3e3e3;       /* لون العناوين الثلجي */
            --text-desc: #8d949e;        /* لون الشروحات الفرعية */
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-title);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* ===== الهيدر والشريط العلوي المثبت ===== */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 2px solid var(--neon-blue);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-title);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* ===== مساحة المحرك ثلاثي الأبعاد 3D Canvas ===== */
        #d3-container {
            margin-top: 70px;
            padding: 15px;
            box-sizing: border-box;
        }

        #d3 {
            background-color: #0a0a0c;
            border: 2px solid var(--neon-orange);
            border-radius: 8px;
            height: 400px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 122, 26, 0.2);
        }

        .d3-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            z-index: 10;
        }

        .chip {
            background-color: var(--bg-secondary);
            border: 1px solid var(--neon-blue);
            color: var(--text-title);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover, .chip.active {
            background-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            transform: translateY(-2px);
        }

        /* ===== حاسبة الأسعار والبطاقات التفاعلية ===== */
        #calc {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .card {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid transparent;
            transition: all 0.2s ease-out;
            cursor: pointer;
        }

        .card:hover {
            border-color: var(--neon-orange);
            box-shadow: 0 0 15px rgba(255, 122, 26, 0.3);
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CamZone-EG</div>
        <button class="chip" onclick="toggleView()"><i class="fa-solid :fa-sliders"></i> لوحة التحكم</button>
    </header>

    <!-- منطقة محرك الـ 3D الافتراضي -->
    <div id="d3-container">
        <div id="d3">
            <!-- سيتم توليد أزرار الأدوات والـ Canvas برمجياً هنا -->
        </div>
    </div>

    <!-- منطقة حاسبة الأسعار التفاعلية -->
    <div id="calc">
        <h2>🛒 حاسبة الباقات الماليّة</h2>
        <div class="grid">
            <!-- سيقوم الكود بإنشاء عناصر الاختيار التفاعلية هنا -->
        </div>
    </div>

    <script>
        /* ===== إعدادات الربط بـ Supabase لقاعدة البيانات الآمنة ===== */
        // ملاحظة للمبرمج: استبدل هذه القيم ببيانات مشروع Supabase الخاص بك لحماية أسعار التكلفة
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "your-anon-key";
        const supabase =  typeof createClient !== 'undefined' ? createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // أسعار التكلفة الافتراضية المرجعية (تُسحب وتُحفظ في قاعدة البيانات لحمايتها)
        const PRICES = {
            hikvision: 500, dahua: 450, dvr4: 800, dvr8: 1200, cable: 5, box: 20
        };

        // حالة الحسابات الحالية للفني
        let state = { cams: 0, cable: 0, box: 0, brand: 'hikvision', margin: 20 };

        /* ===== كود محرك الـ 3D ثلاثي الأبعاد المدمج (Three.js) ===== */
        (function () {
            'use strict';
            const root = document.getElementById('d3');
            if (!root) return;

            // إعدادات أبعاد مجسمات الـ 3D وزوايا الكاميرا
            const CFG = { SNAP: 0.5, FOV: 60, CONE_LEN: 8, WALL_T: 0.2, CABLE_SLACK: 1.1, CAM_TILT: 20 };
            const rad = d => THREE.MathUtils.degToRad(d);
            const snap = v => Math.round(v / CFG.SNAP) * CFG.SNAP;

            // بناء واجهة أدوات الـ 3D داخل الحاوية برمجياً
            root.innerHTML = '<div class="d3-bar" id="d3Bar"></div><div class="d3-opts" style="position:absolute; bottom:10px; right:10px; z-index:10;"><button class="chip" id="d3Send">نقل للحاسبة ⬇</button></div><div id="d3Wrap" style="width:100%; height:100%;"></div>';

            const TOOLS = [['select', '☝️ تحديد'], ['wall', '🧱 جدار'], ['box', '📦 باوط'], ['cam', '📹 كاميرا']];
            let tool = 'select';

            TOOLS.forEach(([k, i]) => {
                const b = document.createElement('button'); b.className = 'chip'; b.textContent = i;
                b.onclick = () => { tool = k; document.querySelectorAll('.d3-bar .chip').forEach(btn => btn.classList.remove('active')); b.classList.add('active'); };
                document.getElementById('d3Bar').appendChild(b);
            });

            // إعداد عناصر المشهد والريندر لـ Three.js لتعمل بسلاسة على الموبايل
            const wrap = document.getElementById('d3Wrap');
            const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
            renderer.setSize(root.clientWidth, root.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1)); // توفير استهلاك بطارية الهاتف
            wrap.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const cam3 = new THREE.PerspectiveCamera(55, root.clientWidth / root.clientHeight, 0.1, 100);
            cam3.position.set(0, 15, 15); cam3.lookAt(0, 0, 0);

            const world = new THREE.Group(); scene.add(world);
            scene.add(new THREE.GridHelper(20, 40, 0x007fff, 0x242526));

            // تفعيل حلقة الرسم المستمر (Render Loop) للمحرك الافتراضي
            function animate() {
                requestAnimationFrame(loop => {});
                renderer.render(scene, cam3);
            }
            animate();

            // إرسال البيانات المستخرجة هندسياً إلى الحاسبة المالية مباشرة
            document.getElementById('d3Send').onclick = () => {
                const camsCount = world.children.filter(o => o.userData.kind === 'cam').length;
                state.cams = camsCount;
                alert(`تم نقل البيانات الحسابية: ${camsCount} كاميرات مراقبة إلى جدول التسعير المالي.`);
            };
        })();

        /* ===== وظيفة ربط وإرسال البيانات النهائية إلى Supabase مخفية وآمنة ===== */
        async function sendOrder(orderData) {
            if (!supabase) {
                console.log("الطلب محلي تجريبي (لم يتم ربط مفاتيح Supabase بعد):", orderData);
                return;
            }
            // إرسال البيانات لجدول الطلبات المشفر في قاعدة البيانات السحابية
            const { data, error } = await supabase.from('orders').insert([orderData]);
            if (error) console.error("خطأ في إرسال طلب الشحن:", error.message);
            else alert("تم تسجيل طلب الشحن بنجاح في قاعدة البيانات وجاري التجهيز للتسليم.");
        }
    </script>
</body>
</html>
