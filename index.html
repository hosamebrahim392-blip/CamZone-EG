<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CamZone EG 🛠️</title>
    <style>
        :root {
            --bg-dark: #0a1128;
            --bg-card: #1c2541;
            --neon-orange: #ff6b35;
            --neon-blue: #00b4d8;
            --text-light: #f4f5f6;
            --text-muted: #8ecae6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        header {
            background-color: var(--bg-card);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--neon-orange);
        }

        header h1 {
            color: var(--neon-orange);
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .tabs {
            display: flex;
            background-color: var(--bg-card);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 5px;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--neon-orange);
            border-bottom: 3px solid var(--neon-orange);
            background-color: rgba(255, 107, 53, 0.05);
        }

        .tab-content {
            display: none;
            padding: 12px;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 1.05rem;
            margin-bottom: 12px;
            color: var(--neon-blue);
            border-right: 3px solid var(--neon-blue);
            padding-right: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 5px;
            color: white;
            font-size: 1rem;
        }

        .price-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .price-table th, .price-table td {
            padding: 8px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .price-table input {
            width: 70px;
            padding: 5px;
            background-color: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            border-radius: 4px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--neon-orange);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-secondary {
            background-color: var(--neon-blue);
        }

        /* تعديل منطقة أدوات الرسم لتناسب الموبايل */
        .toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .tool-btn {
            padding: 10px 14px;
            background-color: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .tool-btn.active {
            background-color: var(--neon-orange);
            border-color: var(--neon-orange);
            box-shadow: 0 0 8px rgba(255, 107, 53, 0.4);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            background-color: #111a36;
            border-radius: 8px;
            border: 2px dashed rgba(255,255,255,0.1);
            margin-bottom: 10px;
            touch-action: none; /* تمنع تهنيج السحب في الموبايل */
        }

        canvas {
            display: block;
            width: 100%;
            height: 380px;
            background-color: #111a36;
        }

        .summary-box {
            background-color: rgba(0, 180, 216, 0.1);
            border: 1px solid var(--neon-blue);
            padding: 12px;
            border-radius: 8px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .summary-total {
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 6px;
            font-weight: bold;
            color: var(--neon-orange);
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>CamZone EG 🛠️</h1>
        <p>الأداة الذكية المتكاملة لتخطيط وحساب شبكات الكاميرات</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="tab-btn-planner" onclick="switchTab('planner-tab')">المخطط والكروكي 📐</button>
        <button class="tab-btn" id="tab-btn-calculator" onclick="switchTab('calculator-tab')">حاسبة الباقات 💰</button>
        <button class="tab-btn" id="tab-btn-prices" onclick="switchTab('prices-tab')">تعديل الأسعار ⚙️</button>
    </div>

    <!-- تبويب المخطط واللوحة التفاعلية -->
    <div id="planner-tab" class="tab-content active">
        <div class="toolbar">
            <button class="tool-btn active" id="btn-move" onclick="setTool('move')">🖐️ تحريك وسحب</button>
            <button class="tool-btn" id="btn-camera" onclick="setTool('camera')">📹 وضع كاميرا</button>
            <button class="tool-btn" id="btn-dvr" onclick="setTool('dvr')">📼 وضع DVR/NVR</button>
            <button class="tool-btn" id="btn-wire" onclick="setTool('wire')">⚡ شد سلك</button>
            <button class="tool-btn" id="btn-rotate" onclick="setTool('rotate')">🔄 تدوير 360°</button>
            <button class="tool-btn" style="background-color: #d90429;" onclick="clearCanvas()">🗑️ مسح الكروكي</button>
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
        </div>

        <div class="summary-box">
            <div class="summary-item">
                <span>الكاميرات الموزعة:</span>
                <span id="map-cam-count">0 كاميرات</span>
            </div>
            <div class="summary-item">
                <span>أطوال السلك المستهلك (من الرسم):</span>
                <span id="map-wire-length">0 متر</span>
            </div>
            <div class="summary-total summary-item">
                <span>تكلفة السيستم الإجمالية:</span>
                <span id="map-total-cost">0 جنيه</span>
            </div>
        </div>
    </div>

    <!-- تبويب حاسبة الباقات السريعة -->
    <div id="calculator-tab" class="tab-content">
        <div class="card">
            <h2>المقايسة السريعة الفورية</h2>
            <div class="form-group">
                <label>عدد الكاميرات الإجمالي:</label>
                <input type="number" id="calc-cams" value="4" min="1" oninput="calculateInvoice()">
            </div>
            <div class="form-group">
                <label>نوع نظام الكاميرات:</label>
                <select id="calc-type" onchange="calculateInvoice()">
                    <option value="analog">أنالوج عالي الدقة (HD Coaxial)</option>
                    <option value="ip">شبكي متطور (IP System / PoE)</option>
                </select>
            </div>
            <div class="form-group">
                <label>طول السلك التقريبي (متر):</label>
                <input type="number" id="calc-wires" value="50" min="0" oninput="calculateInvoice()">
            </div>
        </div>

        <div class="card">
            <h2>تفاصيل عرض السعر</h2>
            <div id="invoice-details" style="font-size: 0.9rem; line-height: 1.6; color: var(--text-light);"></div>
            <div class="summary-total summary-item" style="margin-top: 15px; padding-top: 10px;">
                <span>الإجمالي النهائي:</span>
                <span id="calc-total-price">0 جنيه</span>
            </div>
            <button class="btn" onclick="alert('جاري تجهيز ميزة PDF باسم مؤسستك قريباً!')">📥 تحميل مقايسة PDF للعميل</button>
        </div>
    </div>

    <!-- تبويب تعديل قائمة الأسعار الحرة -->
    <div id="prices-tab" class="tab-content">
        <div class="card">
            <h2>تعديل أسعار السوق الحالية</h2>
            <table class="price-table">
                <thead>
                    <tr>
                        <th>المكون</th>
                        <th>السعر الحالي (ج.م)</th>
                    </tr>
                </thead>
                <tbody id="price-table-body"></tbody>
